# Etapa 12/19 — Kubernetes + GPU
# Dois deployments: a API (CPU, stateless, escala horizontal fácil) e
# o servidor de modelo (GPU, mais caro, escala com mais cuidado).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
spec:
  replicas: 3
  selector:
    matchLabels: { app: chat-api }
  template:
    metadata:
      labels: { app: chat-api }
    spec:
      containers:
        - name: chat-api
          image: registry.example.com/llm-support-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: llm-api-keys }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serving
  labels: { app: llm-serving }
spec:
  # menos réplicas: cada pod usa uma GPU inteira (custo alto)
  replicas: 2
  selector:
    matchLabels: { app: llm-serving }
  template:
    metadata:
      labels: { app: llm-serving }
    spec:
      # roda apenas em nós com GPU (node pool dedicado)
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-a100
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model=meta-llama/Llama-3.1-8B-Instruct"
            - "--gpu-memory-utilization=0.9"
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { nvidia.com/gpu: 1 }
            limits: { nvidia.com/gpu: 1 }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api-service
spec:
  selector: { app: chat-api }
  ports: [{ port: 80, targetPort: 8000 }]
