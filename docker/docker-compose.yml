# Etapa 12 — Model Serving (vLLM / TGI / Ollama)
# `chat-api` roda o assistente RAG. O serviço `llm-server` é opcional:
# demonstra como um modelo open-source seria servido localmente via
# Ollama (troca simples de provider em src/llm_client.py).
services:
  chat-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

